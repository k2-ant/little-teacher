<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Little Teacher</title>
  <meta name="description" content="A cozy pretend-play classroom for little teachers.">
  <meta name="theme-color" content="#f7e6c4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Teacher">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden; position: fixed; inset: 0;
      background: #2b1d2e;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    canvas {
      display: block; position: absolute; left: 0; top: 0;
      image-rendering: pixelated; image-rendering: crisp-edges;
      touch-action: none;
    }
    #safe {
      position: absolute; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    noscript { color: #fff; font: 20px sans-serif; position: absolute; top: 40%; width: 100%; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="safe"></div>
  <noscript>Little Teacher needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
